[pytest]
# Identity-arbitration unit suite. Hermetic: no camera, no external DB, no
# network, no model weights (see tests/conftest.py).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
